[project]
name = "kwai-collector"
version = "0.1.0"
description = "Coletor de dados do Kwai"
authors = [
    {name = "Tiuteus007-gif", email = "209494330+teusdev7@users.noreply.github.com"}
]
requires-python = ">=3.11,<4.0"
dependencies = [
    "httpx (>=0.28.1,<0.29.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)"
]

[project.scripts]
kwai-collector = "kwai_collector.cli:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "ruff (>=0.16.4,<0.17.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "frida (>=17.18.0,<18.0.0)"
]