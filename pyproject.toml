[project]
name = "kwai-collector"
version = "0.1.0"
description = "CLI em Python para coleta, paginação e normalização de dados públicos do Kwai."
readme = "README.md"
requires-python = ">=3.11,<4.0"

authors = [
    { name = "Tiuteus007-gif", email = "209494330+teusdev7@users.noreply.github.com" }
]

keywords = [
    "python",
    "web-scraping",
    "httpx",
    "data-collection",
    "cli",
]

dependencies = [
    "httpx (>=0.28.1,<0.29.0)",
    "h2 (>=4.4.1,<5.0.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
]

[project.scripts]
kwai-collector = "kwai_collector.cli:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "ruff (>=0.16.4,<0.17.0)",
    "mypy (>=2.3.1,<3.0.0)",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
